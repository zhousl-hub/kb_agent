server:
  port: 8080

spring:
  main:
    web-application-type: reactive
  application:
    name: gateway-service
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
  cloud:
    nacos:
      discovery:
        enabled: false
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        # identity 在 Controller 上使用 /api/v1 前缀；其余服务使用 context-path=/api/v1，网关均完整转发
        - id: identity-service
          uri: http://localhost:8101
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/roles/**
        - id: knowledge-service
          uri: http://localhost:8102
          predicates:
            - Path=/api/v1/knowledge/**,/api/v1/documents/**,/api/v1/search/**,/api/v1/data-sources/**,/api/v1/sync-tasks/**,/api/v1/favorites/**,/api/v1/reports/**
        - id: ai-application-service
          uri: http://localhost:8103
          predicates:
            - Path=/api/v1/apps/**,/api/v1/assistants/**,/api/v1/assistant/**,/api/v1/assistant-sessions/**,/api/v1/chat/**,/api/v1/models/**,/api/v1/model-providers/**,/api/v1/model-routers/**
        - id: operations-service
          uri: http://localhost:8104
          predicates:
            - Path=/api/v1/monitor/**,/api/v1/audit/**,/api/v1/config/**
        - id: notification-service
          uri: http://localhost:8105
          predicates:
            - Path=/api/v1/notifications/**,/api/v1/email/**,/api/v1/sms/**
        - id: file-service
          uri: http://localhost:8106
          predicates:
            - Path=/api/v1/files/**

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

logging:
  level:
    com.kba.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
