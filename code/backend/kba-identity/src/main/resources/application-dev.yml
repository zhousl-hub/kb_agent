spring:
  application:
    name: identity-service
  # 本地开发环境：关闭 Nacos，服务可独立运行
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        # 关闭 Nacos 配置中心，避免依赖外部配置服务
        enabled: false
        import-check:
          enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/kba_identity?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: kba
    password: kba123456
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
