# KBA 集成覆盖配置：将 Dify API 接入共享网络，供 KBA 微服务访问
# 启动方式（在 code/dify/docker 目录下）:
#   1. 先确保共享网络存在（启动 KBA compose.dev 会自动创建）
#   2. cp .env.example .env
#   3. docker compose -f docker-compose.yaml -f docker-compose.kba.yml up -d

services:
  api:
    networks:
      ssrf_proxy_network:
      default:
      kba-shared-network:
        aliases:
          - dify-api

networks:
  kba-shared-network:
    external: true
    name: kba-shared-network
